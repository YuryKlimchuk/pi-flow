schema: spec-driven

context: |
  pi-flow is a local workflow orchestrator (Spring Boot + Spring Shell, Java 27)
  that coordinates Pi Coding Agent sessions through a human-gated, OpenSpec-driven
  workflow. The project itself is developed via OpenSpec.

  Constraints for artifacts and workflows:
  - OpenSpec is the working approach, not a system participant.
  - Workflow stages are provisional; their number and structure are not final.
  - Agent roles are roles of the same Pi Coding Agent; the concrete role set is not fixed.
  - Spring <-> agent communication mechanism and persistence technology are unresolved;
    leave them undecided until a dedicated change.
  - Architecture docs live in docs/system-overview.md and docs/workflow.md; keep them
    consistent with each other and with the decisions above.
  - Write artifacts and docs in English.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
