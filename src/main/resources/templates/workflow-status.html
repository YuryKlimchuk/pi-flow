<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Отслеживание Workflow')}"></head>
<body class="bg-light">
<header th:replace="~{fragments :: header}"></header>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Отслеживание Workflow</h2>
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/repositories}">← К репозиториям</a>
    </div>

    <p class="text-muted">Workflow ID: <code th:text="${workflowId}"></code></p>

    <div th:if="${error != null}" class="alert alert-danger" role="alert">
        <p th:text="${error}" class="mb-0"></p>
    </div>

    <div th:if="${state != null && state.status.name() == 'FAILED'}" class="alert alert-danger" role="alert">
        <h5 class="alert-heading">Workflow завершился ошибкой</h5>
        <p th:text="${state.errorMessage}" class="mb-0"></p>
    </div>

    <div th:if="${state != null && state.analysisText == null && state.status.name() != 'FAILED'}" class="card">
        <div class="card-body text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Выполняется…</span>
            </div>
            <p class="mt-3 mb-0">Анализ задачи выполняется…</p>
            <p class="text-muted small">Этап: <span th:text="${state.currentStage}"></span> · Статус: <span th:text="${state.status}"></span></p>
        </div>
    </div>

    <div th:if="${state != null && state.analysisText != null}" class="card border-success">
        <div class="card-body">
            <h5 class="card-title text-success">Анализ завершён</h5>
            <dl class="row">
                <dt class="col-sm-3">Репозиторий</dt>
                <dd class="col-sm-9" th:text="${state.repositoryUrl}"></dd>
                <dt class="col-sm-3">Issue</dt>
                <dd class="col-sm-9" th:text="${state.issueNumber}"></dd>
                <dt class="col-sm-3">Предложенная ветка</dt>
                <dd class="col-sm-9">
                    <code th:text="${state.branchName}"></code>
                </dd>
            </dl>

            <h6 class="mt-3">Результат анализа</h6>
            <pre class="bg-white border rounded p-3" th:text="${state.analysisText}"></pre>

            <form th:action="@{/workflows/continue}" method="post" class="mt-3">
                <input type="hidden" name="workflowId" th:value="${state.workflowId}">
                <input type="hidden" name="branchName" th:value="${state.branchName}">
                <button type="submit" class="btn btn-primary">Продолжить</button>
            </form>
        </div>
    </div>
</main>
<script th:replace="~{fragments :: scripts}"></script>
<script th:if="${state != null && state.analysisText == null && state.status.name() != 'FAILED'}">
    setTimeout(function () { location.reload(); }, 2000);
</script>
</body>
</html>
