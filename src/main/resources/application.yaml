spring:
  application:
    name: pi-flow

logging:
  level:
    root: INFO
    io.temporal: WARN
    com.hydroyura.agents.piflow.agent: DEBUG
    com.hydroyura.agents.piflow.workflow: DEBUG

github:
  api:
    base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    token: ${GITHUB_PI_FLOW_TOKEN:}
    default-page-size: 30
    connect-timeout: ${GITHUB_API_CONNECT_TIMEOUT:5s}
    read-timeout: ${GITHUB_API_READ_TIMEOUT:30s}

agent:
  executable: ${AGENT_EXECUTABLE:/home/yury/.local/share/pi-node/node-v22.22.3-linux-x64/bin/pi}
  base-args: []
  allowed-environment-variables:
    - PATH
    - HOME
    - DEEPSEEK_API_KEY
    - ANTHROPIC_API_KEY
    - OPENAI_API_KEY
  default-timeout: ${AGENT_DEFAULT_TIMEOUT:10m}
  profiles: {}

workspace:
  base-directory: ${WORKSPACE_BASE_DIRECTORY:${user.home}/.pi-flow/workspaces}
  lock-directory: ${WORKSPACE_LOCK_DIRECTORY:${user.home}/.pi-flow/locks}
  lease-duration: ${WORKSPACE_LEASE_DURATION:5m}
  push-token: ${GITHUB_PI_FLOW_TOKEN:}

workflow:
  temporal:
    endpoint: ${WORKFLOW_TEMPORAL_ENDPOINT:localhost:7233}
    namespace: ${WORKFLOW_TEMPORAL_NAMESPACE:default}
    task-queue: ${WORKFLOW_TEMPORAL_TASK_QUEUE:pi-flow}
