# Схема рабочего процесса: proposal → specs → design → tasks.
schema: spec-driven

# Контекст проекта: вносится во все инструкции по артефактам.
# Сюда — только то, что агент не может вывести из кода, и ограничения,
# влияющие на артефакты и workflow. Выводимые из кода факты держим вне.
context: |
  Проект pi-flow — локальный оркестратор AI-агентов для автоматизации разработки ПО.

  Архитектура — модульный монолит.
  Основные принципы: явные границы модулей, разделение ответственности,
  инверсия зависимостей и минимизация связанности.

  Бизнес-логика должна быть отделена от инфраструктурных деталей.
  Не создавать дополнительные модули и абстракции без обоснованной необходимости.

rules:
  proposal:
    - Описывать цели, границы и критерии успеха изменений.
    - Учитывать существующую архитектуру и нерассмотренные решения.

  specs:
    - Описывать требования и ожидаемое поведение системы.
    - Учитывать ошибки и граничные случаи.

  design:
    - Объяснять архитектурные решения, зависимости и компромиссы.
    - Использовать Mermaid для нетривиальных схем взаимодействия.

  tasks:
    - Разбивать реализацию на проверяемые задачи.
    - Предусматривать необходимые тесты и архитектурные проверки.

# Рекомендации для операций apply и archive (отдельно от правил артефактов).
operations:
  apply:
    guidance:
      - Реализовывать задачи по одной, фиксируя прогресс.
      - Прогонять тесты и сборку после значимых изменений.
  archive:
    guidance:
      - Убедиться, что все задачи закрыты и проверки прошли.
      - Кратко описать итог архивации перед завершением.
